name: RDP - Windows 10

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-10  # Changed to Windows 10
    timeout-minutes: 0  # Set to 0 for no timeout (manual stop only)

    steps:
      - name: Configure Core RDP Settings
        run: |
          # Enable Remote Desktop and disable Network Level Authentication (if needed)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force

          # Remove any existing rule with the same name to avoid duplication
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          
          # Allow any incoming connection on port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart the Remote Desktop service to ensure changes take effect
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)      # A-Z
              Lower   = [char[]](97..122)     # a-z
              Number  = [char[]](48..57)      # 0-9
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126)) # Special characters
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          # Create user
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          
          # Add to groups
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          # Store credentials
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV
          
          # Verify user creation
          if (-not (Get-LocalUser -Name "RDP")) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          
          # Download and install Tailscale
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          # Wait for Tailscale service to start
          Start-Sleep -Seconds 10
          
          # Generate unique hostname with timestamp
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $hostname = "win10-rdp-$timestamp"
          
          # Connect to Tailscale
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$hostname
          
          # Wait for Tailscale to assign an IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 20) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          
          # Store IP in environment variable and output for visibility
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          echo "TAILSCALE_HOSTNAME=$hostname" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "`n=== Connection Details ==="
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Hostname: $env:TAILSCALE_HOSTNAME"
          Write-Host "Username: RDP"
          Write-Host "Password: $($env:RDP_CREDS -replace '.*Password: (.*)', '$1')"
          Write-Host "==========================`n"
          
          # Test connectivity to RDP port
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "✓ RDP connection verified successfully!"

      - name: Keep RDP Active (Infinite Loop)
        run: |
          Write-Host "`n╔══════════════════════════════════════════════════════╗"
          Write-Host "║              RDP IS NOW ACTIVE                        ║"
          Write-Host "║    This workflow will run until manually cancelled    ║"
          Write-Host "╠══════════════════════════════════════════════════════╣"
          Write-Host "║   To connect:                                         ║"
          Write-Host "║   1. Open Remote Desktop Connection (mstsc)          ║"
          Write-Host "║   2. Enter: $env:TAILSCALE_IP            ║"
          Write-Host "║   3. Username: RDP                                   ║"
          Write-Host "║   4. Password: $($env:RDP_CREDS -replace '.*Password: (.*)', '$1') ║"
          Write-Host "╠══════════════════════════════════════════════════════╣"
          Write-Host "║   To stop: Cancel this workflow in GitHub Actions    ║"
          Write-Host "╚══════════════════════════════════════════════════════╝`n"
          
          # Display periodic status updates
          $counter = 0
          while ($true) {
              $counter++
              $currentTime = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              $uptimeMinutes = $counter * 5
              
              Write-Host "[$currentTime] RDP Active for $uptimeMinutes minutes | IP: $env:TAILSCALE_IP"
              
              # Optional: Periodic connectivity test
              if ($counter % 12 -eq 0) {  # Every hour
                  $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
                  if ($testResult.TcpTestSucceeded) {
                      Write-Host "   ✓ RDP port 3389 is accessible"
                  } else {
                      Write-Host "   ✗ RDP port check failed - but continuing"
                  }
              }
              
              # Keep-alive: Prevent timeout by showing activity
              Start-Sleep -Seconds 300  # 5 minutes
          }
